name: redpanda-fleetpulse
networks:
  redpanda_network:
    external: true
    name: redpanda_network

services:
  # React+Vite frontend
  fleetpulse-frontend:
    image: fleetpulse-frontend:1.0
    env_file:
      - .env
    ports:
      - "5173:80"
    networks:
      - redpanda_network
  # React+Vite alert mgmt
  fleetpulse-alert-mgmt:
    image: fleetpulse.alert-mgmt:1.0
    env_file:
      - .env
    ports:
      - "5174:80"
    networks:
      - redpanda_network

  # React+Vite alert mgmt
  fleetpulse-drivers-mgmt:
    image: fleetpulse.drivers-mgmt:1.0
    env_file:
      - .env
    ports:
      - "5175:8080"
    networks:
      - redpanda_network      
      
      