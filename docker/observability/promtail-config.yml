server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  - job_name: docker_containers
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 5s
        filters:
          - name: label
            values: ["com.docker.compose.service"]
    relabel_configs:
      # This uses the Docker Compose service name as the 'job' label
      # e.g., 'signalr-worker', 'db-writer', 'ai-worker'
      - source_labels: ['__meta_docker_container_label_com_docker_compose_service']
        target_label: 'job'
      
      # Also keep the container name for detailed tracing
      - source_labels: ['__meta_docker_container_name']
        regex: '/(.*)'
        target_label: 'container_name'
        
      # Capture the Docker Compose project name (e.g., 'fleetpulse')
      - source_labels: ['__meta_docker_container_label_com_docker_compose_project']
        target_label: 'project'