name: ci-signalrhub

on:
  push:
    branches: [main]
    paths:
      - "FleetPulse.SignalRHub/**"
      - "Directory.Packages.props"           # shared props → rebuild all
      - ".github/workflows/ci-signalrhub.yml"
      - ".github/workflows/build-dotnet.yml"
  pull_request:
    branches: [main]
    paths:
      - "FleetPulse.SignalRHub/**"
      - "Directory.Packages.props"
      - ".github/workflows/ci-signalrhub.yml"
      - ".github/workflows/build-dotnet.yml"
  workflow_dispatch:

concurrency:
  group: ci-signalrhub-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/build-dotnet.yml
    with:
      service: signalrhub
      image-name: fleetpulse-signalrhub
      solution: FleetPulse.SignalRHub/FleetPulse.SignalRHub.slnx
      context: ./FleetPulse.SignalRHub
      dockerfile: FleetPulse.SignalRHub/FleetPulse.SignalRHub/Dockerfile
      # Publish only on pushes to main, never on PRs
      publish: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    secrets: inherit