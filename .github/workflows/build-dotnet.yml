name: build-dotnet

on:
  workflow_call:
    inputs:
      service:     { required: true, type: string }
      image-name:  { required: true, type: string }
      solution:    { required: true, type: string }
      context:     { required: true, type: string }
      dockerfile:  { required: true, type: string }
      publish:     { required: false, type: boolean, default: false }

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
          cache: true
          cache-dependency-path: '**/*.csproj'

      - name: Restore, build, test
        run: |
          dotnet restore ${{ inputs.solution }}
          dotnet build ${{ inputs.solution }} -c Release --no-restore
          dotnet test ${{ inputs.solution }} -c Release --no-build --logger "console;verbosity=normal"

      - name: Lowercase owner
        if: ${{ inputs.publish }}
        id: owner
        run: echo "name=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"

      - uses: docker/login-action@v3
        if: ${{ inputs.publish }}
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v3
        if: ${{ inputs.publish }}

      - name: Build & push image
        if: ${{ inputs.publish }}
        uses: docker/build-push-action@v6
        with:
          context: ${{ inputs.context }}
          file: ${{ inputs.dockerfile }}
          push: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
          tags: |
            ghcr.io/${{ steps.owner.outputs.name }}/${{ inputs.image-name }}:latest
            ghcr.io/${{ steps.owner.outputs.name }}/${{ inputs.image-name }}:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}