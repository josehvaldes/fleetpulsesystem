name: ci-simulator

on:
  push:
    branches: [main]
    paths:
      - "simulator/**"
      - ".github/workflows/ci-simulator.yml"
      - ".github/workflows/build-python.yml"
  pull_request:
    branches: [main]
    paths:
      - "simulator/**"
      - ".github/workflows/ci-simulator.yml"
      - ".github/workflows/build-python.yml"
  workflow_dispatch:

concurrency:
  group: ci-simulator-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/build-python.yml
    with:
      service: simulator
      image-name: fleetpulse-simulator      # in case you ever containerize it
      working-directory: simulator/src
      requirements-path: simulator/src/requirements.txt
      docker-context: ./simulator
      dockerfile: simulator/docker/Dockerfile
      run-tests: false
      publish: false                         # simulator has no image today
    secrets: inherit