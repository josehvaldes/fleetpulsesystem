name: build-python

on:
  workflow_call:
    inputs:
      service:            { required: true, type: string }
      image-name:         { required: true, type: string }
      working-directory:  { required: true, type: string }
      requirements-path:  { required: true, type: string }
      docker-context:     { required: false, type: string }
      dockerfile:         { required: false, type: string }
      run-tests:          { required: false, type: boolean, default: false }
      publish:            { required: false, type: boolean, default: false }

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13.5"
          cache: pip
          cache-dependency-path: ${{ inputs.requirements-path }}

      - run: pip install -r requirements.txt
      - run: pip install ruff pytest pytest-asyncio

      - name: Lint
        run: ruff check .

      - name: Test
        if: ${{ inputs.run-tests }}
        run: python -m pytest -q

      # --- Publish (only when explicitly requested) ---
      - name: Lowercase owner
        if: ${{ inputs.publish }}
        id: owner
        shell: bash
        run: echo "name=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"

      - uses: docker/login-action@v3
        if: ${{ inputs.publish }}
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v3
        if: ${{ inputs.publish }}

      - name: Build & push image
        if: ${{ inputs.publish }}
        uses: docker/build-push-action@v6
        with:
          context: ${{ inputs.docker-context }}
          file: ${{ inputs.dockerfile }}
          push: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
          tags: |
            ghcr.io/${{ steps.owner.outputs.name }}/${{ inputs.image-name }}:latest
            ghcr.io/${{ steps.owner.outputs.name }}/${{ inputs.image-name }}:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}