name: Publish fleetpulse-ai-worker image

on:
  push:
    branches: [main]
    paths:
      - "ai-worker/**"
      - ".github/workflows/publish-ai-worker.yml"
      - ".github/workflows/ci-python.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  SERVICE: fleetpulse-ai-worker

jobs:
  publish:
    name: Build and publish fleetpulse-ai-worker
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set lowercase image owner
        id: owner
        shell: bash
        run: |
          echo "name=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: ./ai-worker
          file: ai-worker/docker/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ steps.owner.outputs.name }}/${{ env.SERVICE }}:latest
            ${{ env.REGISTRY }}/${{ steps.owner.outputs.name }}/${{ env.SERVICE }}:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
