name: ci-frontend

on:
  push:
    branches:
      - main
    paths:
      - "frontend/fleetpulse.alert-mgmt/**"
      - "frontend/fleetpulse.drivers-mgmt/**"
      - "frontend/fleetpulse.frontend/**"
      - "frontend/tests/**"
      - ".github/workflows/ci-frontend.yml"
      - "FleetPulse.Api/FleetPulse.Api/openapi/**"
      - "FleetPulse.SignalRHub/FleetPulse.SignalRHub/openapi/**"
  pull_request:
    branches:
      - main
    paths:
      - "frontend/fleetpulse.alert-mgmt/**"
      - "frontend/fleetpulse.drivers-mgmt/**"
      - "frontend/fleetpulse.frontend/**"
      - "frontend/tests/**"
      - ".github/workflows/ci-frontend.yml"
      - "FleetPulse.Api/FleetPulse.Api/openapi/**"
      - "FleetPulse.SignalRHub/FleetPulse.SignalRHub/openapi/**"
  workflow_dispatch:

concurrency:
  group: ci-frontend-${{ github.ref }}
  cancel-in-progress: true

jobs:
  react-spa:
    name: React SPA Frontend
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: frontend/fleetpulse.frontend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: frontend/fleetpulse.frontend/package-lock.json
      - run: npm ci
        working-directory: frontend/fleetpulse.frontend
      - run: npm run generate:contracts
        working-directory: frontend/fleetpulse.frontend
      - name: Verify generated API client is up to date
        run: git diff --exit-code -- src/generated
        working-directory: frontend/fleetpulse.frontend
      - run: npm run lint
        working-directory: frontend/fleetpulse.frontend
      - run: npm run build
        working-directory: frontend/fleetpulse.frontend
      - run: npm test -- --run --passWithNoTests
        working-directory: frontend/fleetpulse.frontend
  react-mfe:
    name: React Alert Management MFE Frontend
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: frontend/fleetpulse.alert-mgmt } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/fleetpulse.alert-mgmt/package-lock.json
      - run: npm ci
        working-directory: frontend/fleetpulse.alert-mgmt
      - run: npm run generate:contracts
        working-directory: frontend/fleetpulse.alert-mgmt
      - name: Verify generated API client is up to date
        run: git diff --exit-code -- src/generated
        working-directory: frontend/fleetpulse.alert-mgmt
      - run: npm run build
        working-directory: frontend/fleetpulse.alert-mgmt
      - run: npm test -- --run --passWithNoTests
        working-directory: frontend/fleetpulse.alert-mgmt
  angular-drivers-mfe:
    name: Angular Drivers Management MFE Frontend
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: frontend/fleetpulse.drivers-mgmt } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/fleetpulse.drivers-mgmt/package-lock.json
      - run: npm ci
        working-directory: frontend/fleetpulse.drivers-mgmt
      - run: npm run generate:contracts
        working-directory: frontend/fleetpulse.drivers-mgmt
      - name: Verify generated API client is up to date
        run: git diff --exit-code -- src/generated
        working-directory: frontend/fleetpulse.drivers-mgmt
      - run: npx ng build
        working-directory: frontend/fleetpulse.drivers-mgmt
      - run: npx ng test --watch=false
        working-directory: frontend/fleetpulse.drivers-mgmt
  
  playwright:
    name: Playwright E2E
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      # Playwright's webServer config launches these apps during the test run,
      # so their dependencies must be installed first.
      - run: npm ci
        working-directory: frontend/fleetpulse.frontend
      - run: npm ci
        working-directory: frontend/fleetpulse.alert-mgmt
      - run: npm ci
        working-directory: frontend/fleetpulse.drivers-mgmt
      - run: npm ci
        working-directory: frontend/tests

      - run: npx playwright install --with-deps chromium
        working-directory: frontend/tests

      - run: npm run test:e2e
        working-directory: frontend/tests

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: |
            frontend/tests/playwright-report/
            frontend/tests/test-results/
          if-no-files-found: ignore