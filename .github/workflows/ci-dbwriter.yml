name: ci-dbwriter
on:
  push:
    branches: [main]
    paths:
      - "FleetPulse.DbWriter/**"
      - "Directory.Packages.props"           # shared props → rebuild all
      - ".github/workflows/ci-dbwriter.yml"
      - ".github/workflows/build-dotnet.yml"
  pull_request:
    branches: [main]
    paths:
      - "FleetPulse.DbWriter/**"
      - "Directory.Packages.props"
      - ".github/workflows/ci-dbwriter.yml"
      - ".github/workflows/build-dotnet.yml"
  workflow_dispatch:

concurrency:
  group: ci-dbwriter-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/build-dotnet.yml
    with:
      service: db-writer
      image-name: fleetpulse-db-writer
      solution: FleetPulse.DbWriter/FleetPulse.DbWriter.slnx
      context: ./FleetPulse.DbWriter
      dockerfile: FleetPulse.DbWriter/FleetPulse.DbWriter/Dockerfile
      # Publish only on pushes to main, never on PRs
      publish: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    secrets: inherit