name: ci-api

on:
  push:
    branches: [main]
    paths:
      - "FleetPulse.Api/**"
      - "Directory.Packages.props"           # shared props → rebuild all
      - ".github/workflows/ci-api.yml"
      - ".github/workflows/build-dotnet.yml"
  pull_request:
    branches: [main]
    paths:
      - "FleetPulse.Api/**"
      - "Directory.Packages.props"
      - ".github/workflows/ci-api.yml"
      - ".github/workflows/build-dotnet.yml"
  workflow_dispatch:

concurrency:
  group: ci-api-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/build-dotnet.yml
    with:
      service: api
      image-name: fleetpulse-api
      solution: FleetPulse.Api/FleetPulse.Api.slnx
      context: ./FleetPulse.Api
      dockerfile: FleetPulse.Api/FleetPulse.Api/Dockerfile
      # Publish only on pushes to main, never on PRs
      publish: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    secrets: inherit