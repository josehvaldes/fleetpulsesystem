
name: Publish FleetPulse images

on:
  push:
    branches: [main]
    paths:
      - "ai-worker/**"
      - "FleetPulse.DbWriter/**"
      - "FleetPulse.SignalRHub/**"
      - "FleetPulse.Api/**"
      - ".github/workflows/publish-images.yml"
      - ".github/workflows/ci-python.yml"      
      - ".github/workflows/ci-dotnet.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io

jobs:
  publish:
    name: Build and publish ${{ matrix.service }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - service: fleetpulse-api
            context: ./FleetPulse.Api
            dockerfile: FleetPulse.Api/FleetPulse.Api/Dockerfile 
          - service: fleetpulse-signalrhub
            context: ./FleetPulse.SignalRHub
            dockerfile: FleetPulse.SignalRHub/FleetPulse.SignalRHub/Dockerfile 
          - service: fleetpulse-dbwriter
            context: ./FleetPulse.DbWriter
            dockerfile: FleetPulse.DbWriter/FleetPulse.DbWriter/Dockerfile 
          - service: fleetpulse-ai-worker
            context: ./ai-worker
            dockerfile: ai-worker/docker/Dockerfile 

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set lowercase image owner
        id: owner
        shell: bash
        run: |
          echo "name=${GITHUB_REPOSITORY_OWNER,,}" \
            >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          tags: |
            ghcr.io/${{ steps.owner.outputs.name }}/${{ matrix.service }}:latest
            ghcr.io/${{ steps.owner.outputs.name }}/${{ matrix.service }}:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
