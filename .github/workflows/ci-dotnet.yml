name: ci-dotnet

on:
  push:
    branches:
      - main
    paths:
      - "FleetPulse.DbWriter/**"
      - "FleetPulse.SignalRHub/**"
      - "FleetPulse.DbWriter/**/Directory.Packages.props"
      - "FleetPulse.SignalRHub/**/Directory.Packages.props"
      - ".github/workflows/ci-dotnet.yml"
  pull_request:
    branches:
      - main
    paths:
      - "FleetPulse.DbWriter/**"
      - "FleetPulse.SignalRHub/**"
      - "FleetPulse.DbWriter/**/Directory.Packages.props"
      - "FleetPulse.SignalRHub/**/Directory.Packages.props"
      - ".github/workflows/ci-dotnet.yml"
  workflow_dispatch:

concurrency:
  group: ci-dotnet-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    name: Build and Test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        solution:
          - FleetPulse.DbWriter/FleetPulse.DbWriter.slnx
          - FleetPulse.SignalRHub/FleetPulse.SignalRHub.slnx
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
          cache: true
          cache-dependency-path: '**/*.csproj'
      - run: dotnet restore ${{ matrix.solution }}
      - run: dotnet build ${{ matrix.solution }} --configuration Release --no-restore
      - run: dotnet test ${{ matrix.solution }} --configuration Release --no-build --logger "console;verbosity=normal"