
{{- if .Values.signalrhub.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-signalr-hub
  labels:
    app: signalr-hub
spec:
  replicas: {{ .Values.signalrhub.replicaCount }}
  selector:
    matchLabels:
      app: signalr-hub
  template:
    metadata:
      labels:
        app: signalr-hub
    spec:
      containers:
        - name: signalr-hub
          image: "{{ .Values.signalrhub.image.repository }}:{{ .Values.signalrhub.image.tag }}"
          imagePullPolicy: {{ .Values.signalrhub.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.signalrhub.containerPort }}
              protocol: TCP
          env:
            {{- toYaml .Values.signalrhub.env | nindent 12 }}
          envFrom:
            {{- toYaml .Values.signalrhub.envFrom | nindent 12 }}
{{- end }}
