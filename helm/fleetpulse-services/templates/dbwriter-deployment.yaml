
{{- if .Values.dbwriter.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-dbwriter
  labels:
    app.kubernetes.io/name: dbwriter
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  replicas: {{ .Values.dbwriter.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: dbwriter
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: dbwriter
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      containers:
        - name: dbwriter
          image: "{{ .Values.dbwriter.image.repository }}:{{ .Values.dbwriter.image.tag }}"
          imagePullPolicy: {{ .Values.dbwriter.image.pullPolicy }}
          ports:
            - name: metrics
              containerPort: {{ .Values.dbwriter.containerPort }}
              protocol: TCP
          env:
            {{- toYaml .Values.dbwriter.env | nindent 12 }}
{{- end }}
