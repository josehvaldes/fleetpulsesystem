apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: fleetpulse-backend
  namespace: fleetpulse
spec:
  parentRefs:
    - name: fleetpulse-gateway
      namespace: default # since the gateway is in default namespace
      sectionName: http

  rules:
    # REST API: Drivers
    - matches:
        - path:
            type: PathPrefix
            value: /api/v1/drivers
      backendRefs:
        - name: fleetpulse-api
          port: 8080

    # REST API: Alerts
    - matches:
        - path:
            type: PathPrefix
            value: /api/v1/alerts
      backendRefs:
        - name: fleetpulse-api
          port: 8080

    # Session login and related endpoints
    - matches:
        - path:
            type: PathPrefix
            value: /api/v1/sessions
      backendRefs:
        - name: fleetpulse-signalr-hub
          port: 8080

    - matches:
        - path:
            type: PathPrefix
            value: /v1/fleetHub
      backendRefs:
        - name: fleetpulse-signalr-hub
          port: 8080