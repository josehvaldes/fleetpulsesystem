
{{- if .Values.api.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: fleetpulse-api
  labels:
    app: fleetpulse-api
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  type: {{ .Values.api.service.type }}
  selector:
    app: fleetpulse-api
  ports:
    - name: http
      port: {{ .Values.api.service.port }}
      targetPort: http
      protocol: TCP
{{- end }}
