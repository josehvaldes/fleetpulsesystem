
{{- if .Values.dbwriter.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-dbwriter
  labels:
    app: dbwriter
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: dbwriter
    app.kubernetes.io/instance: {{ .Release.Name }}
  ports:
    - name: metrics
      port: {{ .Values.dbwriter.service.port }}
      targetPort: metrics
      protocol: TCP
{{- end }}
