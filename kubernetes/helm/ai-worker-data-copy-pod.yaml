apiVersion: v1
kind: Pod
metadata:
  name: ai-worker-data-copy
  namespace: fleetpulse
spec:
  restartPolicy: Never
  containers:
    - name: copy-target
      image: busybox:1.36
      command: ["sh", "-c", "sleep 36000"]
      volumeMounts:
        - name: ai-worker-data
          mountPath: /app/data
  volumes:
    - name: ai-worker-data
      persistentVolumeClaim:
        claimName: fleetpulse-ai-worker-data